name: Compilar APK

on:
  workflow_dispatch:   # boton "Run workflow" desde el movil

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unir y descomprimir el proyecto
        run: |
          cat SkateLevel.zip.part*.bin > SkateLevel.zip
          unzip -q SkateLevel.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.1

      - name: Compilar (ads=true)
        working-directory: SkateLevel
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SkateLevel-debug-apk
          path: SkateLevel/app/build/outputs/apk/debug/*.apk
